<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Aliesn Batch</title>
    
    <!-- Telegram WebApp JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           🎨 PREMIUM THEME VARIABLES
        ========================================== */
        :root { 
            --bg-home: #09090e; --bg-quiz: #050508; 
            --primary: #00e5ff; --primary-glow: rgba(0, 229, 255, 0.4);
            --secondary: #6366f1; --text: #f0fdf4;
            --glass-bg: rgba(20, 20, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; margin:0; padding:0;}
        body { background: var(--bg-home); color: var(--text); font-family: 'Poppins', sans-serif; height: 100vh; overflow: hidden; position: relative;}

        /* ==========================================
           🚪 DOOR TRANSITION
        ========================================== */
        .door-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999; pointer-events: none; }
        .door-panel { position: absolute; top: 0; width: 100%; height: 100%; background: #000; transition: transform 0.6s cubic-bezier(0.8, 0, 0.2, 1); }
        .door-left { left: 0; transform: translateX(-100%); clip-path: polygon(0 0, 60% 0, 40% 30%, 70% 40%, 30% 60%, 60% 70%, 40% 100%, 0 100%); border-right: 2px solid var(--primary); }
        .door-right { right: 0; transform: translateX(100%); clip-path: polygon(100% 0, 60% 0, 40% 30%, 70% 40%, 30% 60%, 60% 70%, 40% 100%, 100% 100%); border-left: 2px solid var(--primary); }
        .door-closed .door-left, .door-closed .door-right { transform: translateX(0); }
        .door-closed { pointer-events: all; }
        .door-closed::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 100%; background: var(--primary); box-shadow: 0 0 40px var(--primary); animation: crackFlash 0.5s infinite alternate; z-index: 10000; }
        @keyframes crackFlash { from { opacity: 0.4; height: 0%; } to { opacity: 1; height: 100%; } }

        .screen { 
            display: none; flex-direction: column; 
            position: absolute; 
            top: 70px !important; 
            left: 0; 
            width: 100%; 
            height: calc(100% - 70px) !important; 
            padding: 15px; 
            padding-top: 0px; 
            padding-bottom: 120px; 
            overflow-y: auto; overflow-x: hidden; z-index: 5;
        }

        /* ==========================================
           💧 HOME EFFECTS
        ========================================== */
        .water-card { width: 100%; height: 160px; position: relative; overflow: hidden; background: #0a0a12; border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 24px; display: flex; align-items: center; padding: 20px; margin-bottom: 25px; box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 5px 20px rgba(0,0,0,0.5); }
        #water-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 60%; background: linear-gradient(180deg, var(--primary) 0%, #0c4a6e 100%); z-index: 1; opacity: 0.5; animation: wave 4s ease-in-out infinite alternate; }
        @keyframes wave { 0% { transform: scaleY(0.9); } 100% { transform: scaleY(1.1); } }
        .water-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 50%); z-index: 5; pointer-events: none; }
        .id-pic { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; margin-right: 15px; background: #000; z-index: 2; box-shadow: 0 0 15px var(--primary-glow); }

        .class-btn { width: 100%; padding: 30px; background: linear-gradient(160deg, #0f101f, #05050a); border: 1px solid var(--primary); border-radius: 24px; text-align: center; box-shadow: 0 0 25px rgba(0, 229, 255, 0.1); cursor: pointer; position: relative; overflow: hidden; transition: 0.3s; margin-top: 10px; }
        .class-btn:active { transform: scale(0.97); }
        .class-text { font-family: 'Orbitron'; font-size: 2rem; font-weight: 900; color: var(--primary); letter-spacing: 2px; text-shadow: 0 0 10px var(--primary-glow); position: relative; z-index: 2; }

        /* ==========================================
           📂 GLASSMORPHISM LIBRARY
        ========================================== */
        .glass-box { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 18px; margin-bottom: 15px; cursor: pointer; display: flex; align-items: center; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.3);}
        .glass-box:active { transform: scale(0.98); }
        .back-btn-modern { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); color: #ccc; border-radius: 20px; padding: 14px; text-align: center; font-weight: 600; margin-top: 15px; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer;}
        
        /* ==========================================
           📱 DOCK & TOAST
        ========================================== */
        .dock-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 250px; height: 70px; background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 40px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 100; }
        .dock-item { font-size: 1.6rem; color: #444; transition: 0.3s; width: 55px; height: 55px; display: flex; justify-content: center; align-items: center; border-radius: 50%; cursor: pointer;}
        .active-dock { color: var(--primary); transform: translateY(-10px); text-shadow: 0 0 20px var(--primary-glow); background: rgba(0, 229, 255, 0.05); border: 1px solid rgba(0, 229, 255, 0.1); }

        #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: rgba(99, 102, 241, 0.95); color: white; padding: 12px 24px; border-radius: 30px; font-weight: bold; font-size: 0.9rem; transition: 0.4s; z-index: 99999; box-shadow: 0 5px 20px rgba(0,0,0,0.5); white-space: nowrap;}
        .show-toast { bottom: 100px !important; }

        /* ==========================================
           📤 PROGRESS SCREEN & MODAL UI
        ========================================== */
        .confirm-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 999999; display: none; justify-content: center; align-items: center; }
        .confirm-box { background: var(--glass-bg); border: 1px solid var(--primary); border-radius: 20px; padding: 25px; width: 85%; text-align: center; box-shadow: 0 0 30px rgba(0,229,255,0.15); }
        .confirm-title { font-family: 'Orbitron'; color: #fff; font-size: 1.2rem; margin-bottom: 10px; font-weight: 700;}
        .confirm-desc { color: #ccc; font-size: 0.9rem; margin-bottom: 25px; }
        .btn-row { display: flex; gap: 15px; }
        .btn-yes { flex: 1; background: var(--primary); color: #000; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-yes:active { transform: scale(0.95); }
        .btn-no { flex: 1; background: rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; border: 1px solid rgba(255,255,255,0.2);}
        .btn-no:active { transform: scale(0.95); }

        .progress-screen { padding: 20px; background: #050508; display: none; flex-direction: column; position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto; z-index: 10; padding-bottom: 40px;}
        .header-glow { text-align: center; font-family: 'Orbitron'; color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); margin-top: 30px; margin-bottom: 25px; font-size: 1.4rem;}
        
        .queue-item { display: flex; align-items: center; background: rgba(20, 20, 30, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 15px; margin-bottom: 12px; transition: 0.3s; }
        .queue-active { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
        .queue-done { border-color: #22c55e; box-shadow: 0 0 15px rgba(34, 197, 94, 0.1); opacity: 0.8;}
        
        .status-icon { font-size: 1.5rem; margin-right: 15px; width: 30px; text-align: center; display: inline-block;}
        .file-name { color: white; font-weight: 600; font-size: 0.95rem; flex-grow: 1; word-break: break-word;}
        
        .stop-btn { width: 100%; padding: 15px; background: #ef4444; color: white; border-radius: 12px; text-align: center; font-weight: bold; margin-top: 20px; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); cursor: pointer; transition: 0.3s;}
        .stop-btn:active { transform: scale(0.97); }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spin-anim { animation: spin 2s linear infinite; }
    </style>
</head>
<body>

    <div id="door-overlay" class="door-overlay">
        <div class="door-panel door-left"></div>
        <div class="door-panel door-right"></div>
    </div>
    
    <div id="toast">Message</div>

    <!-- 🛑 CONFIRMATION MODAL -->
    <div id="confirm-overlay" class="confirm-overlay">
        <div class="confirm-box">
            <div id="confirm-title" class="confirm-title">Send Chapter?</div>
            <div id="confirm-desc" class="confirm-desc">Do you want to send all materials to your chat?</div>
            <div class="btn-row">
                <div class="btn-no" onclick="closeConfirmModal()">Cancel</div>
                <div class="btn-yes" onclick="startSending()">Yes, Send</div>
            </div>
        </div>
    </div>

    <!-- 🏠 HOME SCREEN -->
    <div id="home-screen" class="screen" style="display:flex;">
        <h2 style="text-align:center; font-family:'Orbitron'; color:var(--primary); letter-spacing:2px; text-shadow:0 0 20px var(--primary-glow);">LEARNING HUB</h2>
        <div class="water-card">
            <div id="water-fill"></div>
            <img id="u-pic" class="id-pic" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
            <div style="flex:1; z-index:10; padding-left:15px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="background:var(--primary); color:black; padding:3px 10px; border-radius:6px; font-size:0.7rem; font-weight:800; font-family:'Orbitron';">PREMIUM</span>
                    <span style="color:#fff; font-size: 0.8rem; font-weight:bold; font-family:'Orbitron';">ACTIVE</span>
                </div>
                <div id="u-name" style="font-size:1.4rem; font-weight:700; margin:4px 0; color:white;">Loading...</div>
                <div style="width:100%; height:8px; background:rgba(0,0,0,0.5); border-radius:10px; overflow:hidden; border:1px solid rgba(0, 229, 255, 0.3); margin-top:8px;">
                    <div style="width:100%; height:100%; background:linear-gradient(90deg, #00e5ff, #6366f1);"></div>
                </div>
            </div>
        </div>
        <div style="margin-top:20px;">
            <div class="class-btn" onclick="doorTransition(['Aliesn Batch'])">
                <div class="class-text">ALIESN BATCH 🍿</div>
                <div style="font-size:0.8rem; color:#888; margin-top:8px; font-weight:500;">TAP TO ACCESS LECTURES</div>
            </div>
        </div>
    </div>

    <!-- 📁 FOLDER SCREEN -->
    <div id="folder-screen" class="screen">
        <h3 id="folder-title" style="text-align:center; font-family:'Orbitron'; color:var(--primary); text-shadow: 0 0 15px var(--primary-glow); margin-bottom: 20px;">LIBRARY</h3>
        <div id="folder-list" style="margin-bottom: 10px;"></div>
        <div class="back-btn-modern" onclick="doorTransition(null, 'back')">⬅️ GO BACK</div>
    </div>

    <!-- 📤 PROGRESS SCREEN -->
    <div id="progress-screen" class="progress-screen">
        <h3 class="header-glow" id="progress-title">📤 Sending Chapter...</h3>
        <div id="queue-list">
            <!-- Populated via JS -->
        </div>
        <div id="stop-btn" class="stop-btn" onclick="stopQueue()">🛑 STOP SENDING</div>
    </div>

    <!-- 👤 PROFILE SCREEN -->
    <div id="profile-screen" class="screen">
        <h2 style="text-align:center; font-family:'Orbitron'; color:var(--primary); margin-bottom:20px;">PROFILE</h2>
        <div class="glass-box" onclick="tg.openTelegramLink('https://t.me/errorkid_05')">
            <span style="font-size:1.5rem; margin-right:15px; text-shadow:0 0 10px var(--primary-glow);">📢</span> 
            <b>Join Official Channel</b>
        </div>
    </div>

    <!-- 📱 BOTTOM DOCK -->
    <div class="dock-container" id="main-dock">
        <div class="dock-item active-dock" onclick="switchTab('home', this)">🏠</div>
        <div class="dock-item" onclick="switchTab('profile', this)">👤</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        
        try { if (tg.requestFullscreen) tg.requestFullscreen(); } catch(e) {}
        try {
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); 
            if (tg.enableClosingConfirmation) tg.enableClosingConfirmation(); 
        } catch(e) {}
        
        tg.setHeaderColor('#09090e');
        
        const user = tg.initDataUnsafe.user || {id: 8718760365, first_name: "Student"};
        if(document.getElementById('u-name')) document.getElementById('u-name').innerText = user.first_name;
        if(user.photo_url && document.getElementById('u-pic')) document.getElementById('u-pic').src = user.photo_url;
        
        let fullData = {}; let path = []; 
        let sendingQueue = false;
        let currentDataQueue = [];

        fetch('/api/get_data').then(r=>r.json()).then(data=>{ fullData = data; });

        function showToast(msg) {
            let t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show-toast');
            setTimeout(() => { t.classList.remove('show-toast'); }, 3000);
        }

        function doorTransition(p, action) {
            let door = document.getElementById('door-overlay'); door.classList.add('door-closed');
            setTimeout(() => {
                if(action === 'back') { back(); } else { nav(p); }
                setTimeout(() => { door.classList.remove('door-closed'); }, 500);
            }, 600);
        }

        function switchTab(t, btn) {
            document.querySelectorAll('.screen').forEach(s=>s.style.display='none');
            document.getElementById('progress-screen').style.display='none';
            document.getElementById(t==='profile' ? 'profile-screen' : 'home-screen').style.display='flex';
            document.querySelectorAll('.dock-item').forEach(d=>d.classList.remove('active-dock'));
            if(btn) btn.classList.add('active-dock');
        }

        function nav(p) { path=p; document.querySelectorAll('.screen').forEach(s=>s.style.display='none'); document.getElementById('folder-screen').style.display='flex'; document.getElementById('main-dock').style.display='none'; renderFolder(); }
        
        function back() { 
            if(path.length > 1) { path.pop(); renderFolder(); } 
            else { document.querySelectorAll('.screen').forEach(s=>s.style.display='none'); document.getElementById('home-screen').style.display='flex'; document.getElementById('main-dock').style.display='flex'; } 
        }
        
        function renderFolder() {
            let ref = fullData; path.forEach(k => ref = ref[k]);
            let list = document.getElementById('folder-list'); list.innerHTML = ''; 
            if(!ref) return; 
            
            let currentTitle = path[path.length-1] || 'LIBRARY';
            document.getElementById('folder-title').innerText = currentTitle;

            // Trigger Progress Logic if it contains data arrays
            if(ref.mode === 'video' || Array.isArray(ref.data)) {
                showConfirmModal(currentTitle, ref.data);
                return;
            }

            // Normal Folder Render (Star Logic)
            let allFolders = Object.keys(ref).filter(k => k !== 'mode' && k !== 'data');
            let savedStars = JSON.parse(localStorage.getItem('aliesn_pinned') || '[]');
            
            let pinnedFolders = [];
            let normalFolders = [];
            
            allFolders.forEach(k => {
                let fullPathKey = [...path, k].join('/');
                if(savedStars.includes(fullPathKey)) pinnedFolders.push(k);
                else normalFolders.push(k);
            });

            let sortedFolders = [...pinnedFolders, ...normalFolders];

            sortedFolders.forEach(k => {
                let fullPathKey = [...path, k].join('/');
                let isPinned = savedStars.includes(fullPathKey);

                let d = document.createElement('div'); 
                d.className = 'glass-box';
                d.style.display = 'flex';
                d.style.justifyContent = 'space-between';
                d.style.alignItems = 'center';
                
                let leftSide = document.createElement('div');
                leftSide.style.display = 'flex';
                leftSide.style.alignItems = 'center';
                leftSide.style.width = '70%';
                leftSide.innerHTML = `<span style="font-size:1.6rem; margin-right:15px; text-shadow: 0 0 10px var(--primary-glow);">📁</span> <span style="font-weight:600; font-size:1.05rem; word-break: break-word;">${k}</span>`;
                leftSide.onclick = () => doorTransition([...path, k]);

                let rightSide = document.createElement('div');
                rightSide.style.display = 'flex';
                rightSide.style.alignItems = 'center';
                rightSide.style.gap = '15px';

                let starBtn = document.createElement('span');
                starBtn.innerHTML = isPinned ? '⭐' : '☆'; 
                starBtn.style.fontSize = '1.5rem';
                starBtn.style.color = isPinned ? '#FFD700' : '#888';
                starBtn.style.transition = '0.3s';
                
                starBtn.onclick = (e) => {
                    e.stopPropagation(); 
                    let currentStars = JSON.parse(localStorage.getItem('aliesn_pinned') || '[]');
                    if(currentStars.includes(fullPathKey)) {
                        currentStars = currentStars.filter(s => s !== fullPathKey); 
                    } else {
                        currentStars.push(fullPathKey); 
                    }
                    localStorage.setItem('aliesn_pinned', JSON.stringify(currentStars));
                    try { tg.HapticFeedback.impactOccurred('light'); } catch(err){}
                    renderFolder(); 
                };

                rightSide.appendChild(starBtn);

                if(String(user.id) === "8718760365") {
                    let delBtn = document.createElement('span'); 
                    delBtn.innerText = '🗑️'; 
                    delBtn.style.fontSize = '1.3rem';
                    delBtn.onclick = (e) => { e.stopPropagation(); deleteItem(k); }; 
                    rightSide.appendChild(delBtn);
                }

                d.appendChild(leftSide);
                d.appendChild(rightSide);
                list.appendChild(d);
            });
        }

        function deleteItem(target) {
            if(!confirm(`Delete "${target}" permanently?`)) return;
            fetch('/api/admin/delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({uid: user.id, path: path, target: target}) })
            .then(r => r.json()).then(d => { 
                if(d.status) { showToast("✅ Deleted!"); fetch('/api/get_data').then(res=>res.json()).then(data=>{ fullData=data; renderFolder(); }); } 
            });
        }

        // ==========================================
        // 📤 BULK SENDER SYSTEM (QUEUE LOGIC)
        // ==========================================
        function showConfirmModal(chapterName, data) {
            document.getElementById('confirm-title').innerText = chapterName;
            document.getElementById('confirm-desc').innerText = `Do you want to send all ${data.length} materials (Videos & Notes) to your chat?`;
            document.getElementById('confirm-overlay').style.display = 'flex';
            currentDataQueue = data;
        }

        function closeConfirmModal() {
            document.getElementById('confirm-overlay').style.display = 'none';
        }

        async function startSending() {
            closeConfirmModal();
            document.querySelectorAll('.screen').forEach(s => s.style.display='none');
            document.getElementById('main-dock').style.display = 'none';
            document.getElementById('progress-screen').style.display = 'flex';
            
            let qList = document.getElementById('queue-list');
            qList.innerHTML = '';
            
            // Generate list UI
            currentDataQueue.forEach((item, idx) => {
                let icon = (item.type === 'video' || (item.url && item.url.includes('mp4'))) ? '🎥' : '📄';
                qList.innerHTML += `
                    <div class="queue-item" id="q-item-${idx}">
                        <span class="status-icon" id="q-icon-${idx}">${icon}</span>
                        <span class="file-name">${item.title || "Document"}</span>
                    </div>
                `;
            });

            sendingQueue = true;
            document.getElementById('stop-btn').innerText = '🛑 STOP SENDING';
            document.getElementById('stop-btn').style.background = '#ef4444';
            document.getElementById('stop-btn').style.pointerEvents = 'auto';

            for(let i=0; i<currentDataQueue.length; i++) {
                if(!sendingQueue) break;
                
                let item = currentDataQueue[i];
                let qItem = document.getElementById(`q-item-${i}`);
                let qIcon = document.getElementById(`q-icon-${i}`);
                
                qItem.classList.add('queue-active');
                qIcon.innerText = '⏳';
                qIcon.classList.add('spin-anim');
                
                // Keep viewport focused on active item
                qItem.scrollIntoView({ behavior: 'smooth', block: 'center' });

                try {
                    let msg_id = item.msg_id;
                    // Fallback backward compatibility for old schema
                    if(!msg_id && item.url) {
                        let parts = item.url.split('/');
                        msg_id = parts.find(p => !isNaN(p) && p.length > 0);
                    }
                    
                    let res = await fetch('/api/send_to_chat', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ uid: user.id, msg_id: msg_id, title: item.title, type: item.type })
                    });
                    let d = await res.json();
                    
                    if(d.status) {
                        qIcon.innerText = '✅';
                        qIcon.classList.remove('spin-anim');
                        qItem.classList.remove('queue-active');
                        qItem.classList.add('queue-done');
                        try { tg.HapticFeedback.impactOccurred('light'); } catch(err){}
                    } else {
                        throw new Error("Failed");
                    }
                } catch(e) {
                    qIcon.innerText = '❌';
                    qIcon.classList.remove('spin-anim');
                    qItem.classList.remove('queue-active');
                }
                
                // Add natural delay to prevent Telegram API Flood limit
                if(sendingQueue && i < currentDataQueue.length - 1) {
                    await new Promise(r => setTimeout(r, 1800)); // 1.8s gap
                }
            }
            
            if(sendingQueue) {
                document.getElementById('stop-btn').innerText = '🎉 ALL DONE';
                document.getElementById('stop-btn').style.background = '#22c55e';
                document.getElementById('stop-btn').style.pointerEvents = 'none';
                showToast("All Lectures Sent!");
                try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
                setTimeout(() => { tg.close(); }, 2000); // Auto close app to show user the chat
            }
        }

        function stopQueue() {
            sendingQueue = false;
            document.getElementById('stop-btn').innerText = '🛑 STOPPED';
            document.getElementById('stop-btn').style.background = '#444';
            document.getElementById('stop-btn').style.pointerEvents = 'none';
            showToast("Queue aborted.");
            try { tg.HapticFeedback.notificationOccurred('warning'); } catch(e){}
        }

    </script>
</body>
</html>
