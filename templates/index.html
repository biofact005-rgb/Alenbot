<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Aliesn Batch</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-home: #09090e; --primary: #00e5ff; --primary-glow: rgba(0, 229, 255, 0.4);
            --secondary: #6366f1; --text: #f0fdf4;
            --glass-bg: rgba(20, 20, 30, 0.6); --glass-border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; margin:0; padding:0;}
        body { background: var(--bg-home); color: var(--text); font-family: 'Poppins', sans-serif; height: 100vh; overflow: hidden; position: relative;}

        /* Door Animation */
        .door-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999; pointer-events: none; }
        .door-panel { position: absolute; top: 0; width: 100%; height: 100%; background: #000; transition: transform 0.6s cubic-bezier(0.8, 0, 0.2, 1); }
        .door-left { left: 0; transform: translateX(-100%); clip-path: polygon(0 0, 60% 0, 40% 30%, 70% 40%, 30% 60%, 60% 70%, 40% 100%, 0 100%); border-right: 2px solid var(--primary); }
        .door-right { right: 0; transform: translateX(100%); clip-path: polygon(100% 0, 60% 0, 40% 30%, 70% 40%, 30% 60%, 60% 70%, 40% 100%, 100% 100%); border-left: 2px solid var(--primary); }
        .door-closed .door-left, .door-closed .door-right { transform: translateX(0); }
        .door-closed { pointer-events: all; }
        
        .screen { display: none; flex-direction: column; position: absolute; top: 0px; left: 0; width: 100%; height: 100%; padding: 15px; overflow-y: auto; overflow-x: hidden; z-index: 5;}
        
        /* Home Components */
        .water-card { width: 100%; height: 160px; position: relative; overflow: hidden; background: #0a0a12; border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 24px; display: flex; align-items: center; padding: 20px; margin-bottom: 25px; box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 5px 20px rgba(0,0,0,0.5); }
        #water-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 60%; background: linear-gradient(180deg, var(--primary) 0%, #0c4a6e 100%); z-index: 1; opacity: 0.5; animation: wave 4s ease-in-out infinite alternate; }
        @keyframes wave { 0% { transform: scaleY(0.9); } 100% { transform: scaleY(1.1); } }
        .id-pic { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; margin-right: 15px; background: #000; z-index: 2; box-shadow: 0 0 15px var(--primary-glow); }
        
        .class-btn { width: 100%; padding: 30px; background: linear-gradient(160deg, #0f101f, #05050a); border: 1px solid var(--primary); border-radius: 24px; text-align: center; box-shadow: 0 0 25px rgba(0, 229, 255, 0.1); cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .class-btn:active { transform: scale(0.97); }
        .class-text { font-family: 'Orbitron'; font-size: 2rem; font-weight: 900; color: var(--primary); letter-spacing: 2px; text-shadow: 0 0 10px var(--primary-glow); }

        /* Folders */
        .glass-box { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 18px; margin-bottom: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.3);}
        .glass-box:active { transform: scale(0.98); }
        
        .back-btn-modern { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); color: #ccc; border-radius: 20px; padding: 14px; text-align: center; font-weight: 600; margin-top: 15px; transition: 0.3s; display: flex; justify-content: center; align-items: center; cursor: pointer;}
        .back-btn-modern:active { transform: scale(0.98); background: rgba(255,255,255,0.1);}

        /* Sending Cards UI */
        .send-card { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: var(--glass-bg); border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--glass-border); transition: 0.3s; }
        .send-card.sending { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        .send-card.sent { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        .s-title { flex: 1; margin: 0 12px; font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white;}
        .s-status { font-size: 1.2rem; }

        /* Modal */
        #custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999999; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #111; padding: 25px; border-radius: 20px; border: 1px solid var(--primary); width: 100%; max-width: 350px; text-align: center; box-shadow: 0 0 30px var(--primary-glow); }
        
        #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: rgba(99, 102, 241, 0.95); color: white; padding: 12px 24px; border-radius: 30px; font-weight: bold; font-size: 0.9rem; transition: 0.4s; z-index: 99999; box-shadow: 0 5px 20px rgba(0,0,0,0.5); white-space: nowrap;}
        .show-toast { bottom: 30px !important; }
    </style>
</head>
<body>
    <div id="door-overlay" class="door-overlay">
        <div class="door-panel door-left"></div>
        <div class="door-panel door-right"></div>
    </div>
    <div id="toast">Message</div>

    <!-- Confirmation Modal -->
    <div id="custom-modal">
        <div class="modal-content">
            <h3 style="color:var(--primary); font-family:'Orbitron'; margin-bottom:15px;">Confirm Sending</h3>
            <p id="modal-text" style="color:white; margin-bottom:25px; font-size:1rem;"></p>
            <div style="display:flex; gap:15px; justify-content:center;">
                <button id="modal-yes" style="flex:1; padding:12px; border-radius:12px; background:var(--primary); color:black; font-weight:bold; border:none; cursor:pointer;">YES, SEND</button>
                <button onclick="document.getElementById('custom-modal').style.display='none'" style="flex:1; padding:12px; border-radius:12px; background:#333; color:white; font-weight:bold; border:none; cursor:pointer;">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- HOME SCREEN -->
    <div id="home-screen" class="screen" style="display:flex; top:20px;">
        <h2 style="text-align:center; font-family:'Orbitron'; color:var(--primary); letter-spacing:2px; text-shadow:0 0 20px var(--primary-glow);">LEARNING HUB</h2>
        <div class="water-card">
            <div id="water-fill"></div>
            <img id="u-pic" class="id-pic" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
            <div style="flex:1; z-index:10; padding-left:15px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="background:var(--primary); color:black; padding:3px 10px; border-radius:6px; font-size:0.7rem; font-weight:800; font-family:'Orbitron';">PREMIUM</span>
                </div>
                <div id="u-name" style="font-size:1.4rem; font-weight:700; margin:4px 0; color:white;">Loading...</div>
            </div>
        </div>
        <div style="margin-top:20px;">
            <div class="class-btn" onclick="doorTransition(['Aliesn Batch'])">
                <div class="class-text">ALIESN BATCH 🍿</div>
                <div style="font-size:0.8rem; color:#888; margin-top:8px; font-weight:500;">TAP TO ACCESS FOLDERS</div>
            </div>
        </div>
    </div>

    <!-- FOLDER SCREEN -->
    <div id="folder-screen" class="screen" style="top:20px;">
        <h3 id="folder-title" style="text-align:center; font-family:'Orbitron'; color:var(--primary); text-shadow: 0 0 15px var(--primary-glow); margin-bottom: 20px;">LIBRARY</h3>
        <div id="folder-list" style="margin-bottom: 10px;"></div>
        <div class="back-btn-modern" onclick="doorTransition(null, 'back')">⬅️ GO BACK</div>
    </div>

    <!-- SENDING SCREEN (NEW) -->
    <div id="sending-screen" class="screen" style="top:20px; padding-bottom: 50px;">
        <h3 id="sending-title" style="text-align:center; font-family:'Orbitron'; color:var(--primary); text-shadow: 0 0 15px var(--primary-glow); margin-bottom: 20px;">🚀 SENDING TO CHAT</h3>
        
        <button id="stop-btn" onclick="stopSending()" style="width:100%; background:linear-gradient(90deg, #ef4444, #991b1b); color:white; padding:15px; border-radius:14px; margin-bottom:20px; font-weight:bold; cursor:pointer; border:1px solid #f87171; text-align:center; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);">
            🛑 STOP PROCESS
        </button>
        
        <div id="sending-list"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#09090e');
        
        const user = tg.initDataUnsafe.user || {id: 8718760365, first_name: "Admin"};
        if(document.getElementById('u-name')) document.getElementById('u-name').innerText = user.first_name;
        
        let fullData = {}; let path = []; 
        let cancelSending = false;

        fetch('/api/get_data').then(r=>r.json()).then(data=>{ fullData = data; });

        function showToast(msg) {
            let t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show-toast');
            setTimeout(() => { t.classList.remove('show-toast'); }, 3000);
        }

        function doorTransition(p, action) {
            let door = document.getElementById('door-overlay'); door.classList.add('door-closed');
            setTimeout(() => {
                if(action === 'back') { back(); } else { nav(p); }
                setTimeout(() => { door.classList.remove('door-closed'); }, 500);
            }, 600);
        }

        function nav(p) { path=p; document.querySelectorAll('.screen').forEach(s=>s.style.display='none'); document.getElementById('folder-screen').style.display='flex'; renderFolder(); }
        
        function back() { 
            if(path.length > 1) { path.pop(); renderFolder(); } 
            else { document.querySelectorAll('.screen').forEach(s=>s.style.display='none'); document.getElementById('home-screen').style.display='flex'; } 
        }
        
        function renderFolder() {
            let ref = fullData; path.forEach(k => ref = ref[k]);
            let list = document.getElementById('folder-list'); list.innerHTML = ''; 
            if(!ref) return; document.getElementById('folder-title').innerText = path[path.length-1] || 'LIBRARY';

            // Iterate over keys inside the current path
            let items = Object.keys(ref).filter(k => k !== 'data');
            
            items.forEach(k => {
                let d = document.createElement('div'); 
                d.className = 'glass-box';
                
                // Left side
                let leftSide = document.createElement('div');
                leftSide.style.display = 'flex'; leftSide.style.alignItems = 'center'; leftSide.style.width = '80%';
                
                // Agar aage wali directory me 'data' list hai, toh matlab wo Chapter hai
                let isChapter = ref[k].data && Array.isArray(ref[k].data);
                let icon = isChapter ? '📚' : '📁';
                
                leftSide.innerHTML = `<span style="font-size:1.6rem; margin-right:15px;">${icon}</span> <span style="font-weight:600; font-size:1.05rem; word-break: break-word;">${k}</span>`;
                
                // CLick Logic (Folder kholo ya Bulk Send Modal dikhao)
                d.onclick = () => {
                    if (isChapter) {
                        triggerChapterSend(k, ref[k].data);
                    } else {
                        doorTransition([...path, k]);
                    }
                };

                // Admin Delete Button
                let rightSide = document.createElement('div');
                if(String(user.id) === "8718760365") {
                    let delBtn = document.createElement('span'); 
                    delBtn.innerText = '🗑️'; delBtn.style.fontSize = '1.3rem';
                    delBtn.onclick = (e) => { e.stopPropagation(); deleteItem(k); }; 
                    rightSide.appendChild(delBtn);
                }

                d.appendChild(leftSide); d.appendChild(rightSide);
                list.appendChild(d);
            });
        }

        function deleteItem(target) {
            if(!confirm(`Delete "${target}"?`)) return;
            fetch('/api/admin/delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({uid: user.id, path: path, target: target}) })
            .then(r => r.json()).then(d => { 
                if(d.status) { showToast("✅ Deleted!"); fetch('/api/get_data').then(res=>res.json()).then(data=>{ fullData=data; renderFolder(); }); } 
            });
        }

        // ==========================================
        // 🚀 BULK SEND LOGIC
        // ==========================================
        function triggerChapterSend(chapterName, filesArray) {
            if(filesArray.length === 0) { showToast("⚠️ Chapter is empty!"); return; }
            
            let modal = document.getElementById('custom-modal');
            document.getElementById('modal-text').innerHTML = `You are about to send <b>${filesArray.length} items</b> to your chat.<br><br>Do you want to proceed?`;
            modal.style.display = 'flex';
            
            document.getElementById('modal-yes').onclick = () => {
                modal.style.display = 'none';
                startBulkSend(chapterName, filesArray);
            };
        }

        function stopSending() {
            cancelSending = true;
        }

        async function startBulkSend(chapterName, files) {
            cancelSending = false;
            document.querySelectorAll('.screen').forEach(s=>s.style.display='none');
            document.getElementById('sending-screen').style.display='flex';
            document.getElementById('sending-title').innerText = chapterName;
            
            let list = document.getElementById('sending-list');
            list.innerHTML = '';
            
            // UI List Create
            files.forEach((file, index) => {
                let icon = (file.type === 'video') ? '🎥' : '📄';
                list.innerHTML += `
                    <div id="item-${index}" class="send-card">
                        <span style="font-size: 1.4rem;">${icon}</span>
                        <span class="s-title">${file.title}</span>
                        <span id="status-${index}" class="s-status">🕒</span>
                    </div>
                `;
            });
            
            // Line by line sending loop
            for(let i = 0; i < files.length; i++) {
                if(cancelSending) {
                    showToast("🛑 Sending Stopped!");
                    break;
                }
                
                let statusEl = document.getElementById(`status-${i}`);
                let cardEl = document.getElementById(`item-${i}`);
                
                statusEl.innerText = '⏳';
                cardEl.classList.add('sending');
                
                try {
                    let res = await fetch('/api/send_to_chat', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ uid: user.id, msg_id: files[i].msg_id, title: files[i].title, type: files[i].type })
                    });
                    let data = await res.json();
                    
                    if(data.status === 'success') {
                        statusEl.innerText = '✅';
                        cardEl.classList.remove('sending');
                        cardEl.classList.add('sent');
                        try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
                    } else {
                        statusEl.innerText = '❌';
                    }
                } catch(e) {
                    statusEl.innerText = '❌';
                }
                
                // ⏱️ Exact 1 Second ka gap 
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
            
            if(!cancelSending) {
                showToast("🎉 All files sent! Check your chat.");
                setTimeout(() => { tg.close(); }, 1200); // 1.2 sec baad auto close
            }
        }
    </script>
</body>
</html>
